# Reference copy of the three automations created via the HA config API.
# Times are local (Europe/Bucharest on the current instance).

- id: pager_republish_discovery
  alias: "Pager — republish MQTT discovery on start"
  description: >-
    Re-publish the pager's retained MQTT discovery payloads shortly after Home
    Assistant starts. Without this, a broker that lost its retained messages
    leaves every pager entity stuck as "unavailable" (and the restart/reboot
    buttons dead) until the payloads are published again.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    # Give the MQTT client time to connect before publishing.
    - delay: "00:00:10"
    - action: script.pager_publish_discovery

- id: pager_restart_app_daily
  alias: "Pager — restart app daily"
  description: "Every night at 00:00, restart the pager app so it starts each day clean."
  mode: single
  triggers:
    - trigger: time
      at: "00:00:00"
  actions:
    - action: button.press
      target:
        entity_id: button.grandpa_pager_restart_app

- id: pager_reboot_every_3_days
  alias: "Pager — reboot phone every 3 days"
  description: >-
    At 00:00 on every third day, reboot the pager phone. The app restarts on
    boot. There is no native "every N days" trigger, so the cadence is a
    template condition on the epoch day number.
  mode: single
  triggers:
    - trigger: time
      at: "00:00:00"
  conditions:
    - "{{ ((now().timestamp() // 86400) | int) % 3 == 0 }}"
  actions:
    - action: button.press
      target:
        entity_id: button.grandpa_pager_reboot_phone
