name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Optional: sign with a real release key if these repo secrets are set
      # (KEYSTORE_B64 = base64 of the .jks, plus KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD). Without them the build falls back to the debug key.
      - name: Set up release keystore (optional)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
              > keystore.properties
            echo "Signing with the provided release keystore."
          else
            echo "No keystore secrets; falling back to the debug key."
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
