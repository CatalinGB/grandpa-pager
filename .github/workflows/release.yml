name: Release (manual, signed)

# Releases MUST be signed with the keystore the installed apps already trust
# (android/pager-release.jks, deliberately not in git). CI can only sign
# correctly when that keystore is provided as repository secrets, so this
# workflow is manual-only: a tag push must never publish an APK with a different
# key, because Android would reject it as an update ("App not installed").
#
# The normal release path is local, on the machine that holds the keystore:
#   tools/scripts/release.sh docs/release-notes.md
#
# A CI release needs these repository secrets (docs/runbook.md §5d):
#   KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.5.2). Created if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Require the release keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 is not set. Add the signing secrets (docs/runbook.md §5d) or cut the release locally with tools/scripts/release.sh."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > pager-release.jks
          printf 'storeFile=pager-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify the signing certificate
        working-directory: android
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                 | awk '/SHA-256 digest/{print $NF; exit}')
          echo "signing certificate: $CERT"
          if [ "$CERT" != "1099d30fb2319c594f2a49ba53d44f1af4da128f269eac9a8e3efd5561329674" ]; then
            echo "::error::APK is not signed with the release key (got $CERT) — refusing to publish."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
